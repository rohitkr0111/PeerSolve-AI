
spring.config.import=optional:file:../.env[.properties]
spring.application.name=peersolve-api
spring.data.mongodb.uri=${MONGODB_URI}
server.port=${SERVER_PORT:8082}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:3000}
app.judge0.url=${JUDGE0_URL:}
app.judge0.api-key=${JUDGE0_API_KEY:}
app.judge0.api-host=${JUDGE0_API_HOST:}

# AI Mentor (Groq LLM integration)
ai.mentor.provider=${AI_MENTOR_PROVIDER:disabled}
ai.mentor.apiKey=${AI_MENTOR_API_KEY:}
ai.mentor.baseUrl=${AI_MENTOR_BASE_URL:https://api.groq.com/openai/v1/chat/completions}
ai.mentor.model=${AI_MENTOR_MODEL:llama-3.1-70b-versatile}
ai.mentor.timeoutMs=${AI_MENTOR_TIMEOUT_MS:15000}
